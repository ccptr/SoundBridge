name: Release artifacts

# Builds the Android APKs, the Linux and Windows binaries and the Arch Linux
# package and attaches them to a release when it is published. It can also be
# run by hand for an existing release, to rebuild its files or one kind of them.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to build and attach files to
        required: true
      only:
        description: Build only this job (android, linux, windows or pacman); all of them if empty
        required: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  android:
    if: ${{ !inputs.only || inputs.only == 'android' }}
    name: Android APKs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2

      - uses: gradle/actions/setup-gradle@v5

      # Versions as in android/app/build.gradle.kts (compileSdk, ndkVersion).
      - name: Install the Android platform and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "ndk;27.2.12479018" > /dev/null

      # There is no keystore.properties here, so the release APK is unsigned.
      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease

      - name: Attach to the release
        run: |
          out=android/app/build/outputs/apk
          cp "$out/debug/app-debug.apk" "SoundBridge-$TAG-debug.apk"
          cp "$out/release/app-release-unsigned.apk" "SoundBridge-$TAG-release-unsigned.apk"
          gh release upload "$TAG" --clobber \
            "SoundBridge-$TAG-debug.apk" "SoundBridge-$TAG-release-unsigned.apk"

  linux:
    if: ${{ !inputs.only || inputs.only == 'linux' }}
    name: Linux binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev pkg-config \
            libpipewire-0.3-dev libasound2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev \
            libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Attach to the release
        run: |
          dir="soundbridge-$TAG-linux-x86_64"
          mkdir "$dir"
          cp target/release/soundbridge target/release/soundbridge-desktop LICENSE README.md "$dir"
          tar -czf "$dir.tar.gz" "$dir"
          gh release upload "$TAG" --clobber "$dir.tar.gz"

  windows:
    if: ${{ !inputs.only || inputs.only == 'windows' }}
    name: Windows binaries
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      # Link the C runtime in, so the programs run without the Visual C++
      # redistributable installed.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # gpui compiles its shaders with fxc.exe from the Windows SDK, and only
      # looks for one SDK version on its own.
      - name: Locate fxc.exe
        run: |
          fxc=$(find "/c/Program Files (x86)/Windows Kits/10/bin" -path '*/x64/fxc.exe' | sort -V | tail -n 1)
          test -n "$fxc"
          echo "GPUI_FXC_PATH=$(cygpath -w "$fxc")" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked

      - name: Attach to the release
        run: |
          dir="soundbridge-$TAG-windows-x86_64"
          mkdir "$dir"
          cp target/release/soundbridge.exe target/release/soundbridge-desktop.exe LICENSE README.md "$dir"
          7z a "$dir.zip" "$dir"
          gh release upload "$TAG" --clobber "$dir.zip"

  # Packages the binaries the linux job attached, instead of building them again.
  pacman:
    needs: linux
    # Runs when the linux job was skipped (only: pacman), on what the release
    # already has.
    if: ${{ !failure() && !cancelled() && (!inputs.only || inputs.only == 'pacman') }}
    name: Arch Linux package
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm git github-cli

      # The PKGBUILD of the commit the workflow runs from, which for a run by
      # hand need not be the tag.
      - uses: actions/checkout@v5

      # makepkg refuses to run as root. The archive is already next to the
      # PKGBUILD, so it is not downloaded again; its checksum in the PKGBUILD
      # is that of an earlier build.
      - name: Build
        working-directory: packaging/aur/soundbridge-bin
        run: |
          gh release download "$TAG" --pattern "soundbridge-$TAG-linux-x86_64.tar.gz"
          useradd -m build
          chown -R build .
          sed -i "s/^pkgver=.*/pkgver=${TAG#v}/" PKGBUILD
          su build -c 'makepkg --nodeps --skipchecksums'

      - name: Attach to the release
        working-directory: packaging/aur/soundbridge-bin
        run: gh release upload "$TAG" --clobber soundbridge-bin-"${TAG#v}"-*.pkg.tar.zst
