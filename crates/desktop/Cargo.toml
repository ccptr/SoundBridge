[package]
name = "soundbridge-desktop"
description = "SoundBridge desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "soundbridge-desktop"
path = "src/main.rs"

[dependencies]
soundbridge-core = { workspace = true, features = ["cpal"] }
gpui = "0.2.2"
async-channel = "2"
unicode-segmentation = "1"
