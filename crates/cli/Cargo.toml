[package]
name = "soundbridge-cli"
description = "Command-line SoundBridge: a low-latency audio link between machines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "soundbridge"
path = "src/main.rs"

[dependencies]
soundbridge-core = { workspace = true, features = ["cpal"] }
clap = { version = "4.6", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
