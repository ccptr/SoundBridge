[package]
name = "soundbridge-cli"
description = "Command-line SoundBridge: a low-latency audio link between machines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "soundbridge"
path = "src/main.rs"

[features]
# For the programs released as plain binaries: they keep themselves current.
# A build that a package manager installs is updated by it instead.
self-update = ["dep:soundbridge-update"]

[dependencies]
soundbridge-core = { workspace = true, features = ["cpal"] }
soundbridge-update = { workspace = true, optional = true }
clap = { version = "4.6", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
