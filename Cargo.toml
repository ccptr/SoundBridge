[workspace]
resolver = "2"
members = ["crates/core", "crates/update", "crates/cli", "crates/desktop", "crates/android"]
default-members = ["crates/core", "crates/update", "crates/cli", "crates/desktop"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-2.0-or-later"

[workspace.dependencies]
soundbridge-core = { path = "crates/core" }
soundbridge-update = { path = "crates/update" }

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "debuginfo"

# The audio path (resampler, sample conversion) is unusably slow unoptimized,
# and a debug build that glitches tells you nothing about latency.
[profile.dev.package.soundbridge-core]
opt-level = 3
[profile.dev.package.rtrb]
opt-level = 3
# The noise filter and the FFT under it.
[profile.dev.package.nnnoiseless]
opt-level = 3
[profile.dev.package.easyfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
